    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pajak UIN Datokarama Palu</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap">
    <link rel="shortcut icon" href="favicon.png" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f7f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            color: #0056b3;
            margin-bottom: 10px;
        }

        h4 {
            font-size: 20px;
            color: #555;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .logo-container {
            margin-bottom: 10px;
        }

        .logo-container img {
            height: 100px;
            margin: 0 10px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        input[type="text"] {
            width: calc(100% - 24px);
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #0056b3;
            outline: none;
        }

        .button-container {
            text-align: left;
            margin-top: 20px;
        }

        input[type="button"] {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease, transform 0.3s ease;
            margin-right: 10px;
        }

        input[type="button"]:hover {
            background-color: #004494;
            transform: scale(1.05);
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background: #ffffff;
            border: 1px solid #ddd;
        }

        .result p {
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #333;
        }

        .result p span {
            font-weight: bold;
            color: #0056b3;
        }

        footer {
            margin-top: auto;
            padding: 15px;
            text-align: center;
            background-color: #ffffff;
            border-top: 1px solid #e0e0e0;
            font-size: 14px;
            color: #555;
        }

        .countdown-number {
            color: red;
            font-weight: bold;
            font-size: 18px;
        }

        .countdown-text {
            color: black;
        }

        /* CSS untuk custom class SweetAlert */
        .swal2-popup.custom-swal-popup {
            width: 650px;  /* Sesuaikan lebar sesuai kebutuhan */
            max-width: 90%;  /* Membatasi lebar maksimal */
        }
    </style>
</head>
<body>
<!-- Copyright 2024 Mohammad Husni Mubaraq -->
<div class="container">
    <div class="logo-container">
        <img src="logo-uin.png" alt="Logo UIN Datokarama Palu">
    </div>
    <h1>Perhitungan Pajak UIN Datokarama Palu</h1>
    <h4>Perhitungan Pajak Menggunakan DPP (Dasar Pengenaan Pajak)</h4>
    <div class="form-group">
        <label for="amount">Jumlah Nominal:</label>
        <input type="text" id="amount" placeholder="Masukkan jumlah nominal">
    </div>
    <div class="button-container">
        <input type="button" value="Hitung Pajak" onclick="calculateTaxes()">
        <input type="button" value="Reset" onclick="resetForm()">
    </div>
    <div class="result">
        <p>Hasil Perhitungan DPP PPN : <span id="dpp_ppn">0</span></p>
        <p>Hasil Perhitungan DPP PPH : <span id="dpp_pph">0</span></p>
        <p>PPN (12%) : <span id="ppn">0</span></p>
        <p>PPH Pasal 22 (1.5%) : <span id="pph22">0</span></p>
        <p>PPH Pasal 23 (2%) : <span id="pph23">0</span></p>
    </div>
</div>
<footer>
    &copy; 2024-2026 Husni - All Right Reserved. <br> Build Version: <span id="build-version"></span>
</footer>

<script>
    const buildVersion = "05 Januari 2026"; // Build Version

    function formatCurrency(amount) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(amount);
    }

    // Function to calculate taxes
    function calculateTaxes() {
        var amount = parseFloat(document.getElementById('amount').value.replace(/[^0-9.-]+/g, ''));
        if (isNaN(amount) || amount <= 0) {
            Swal.fire({
                icon: 'error',
                title: 'Nominal Error',
                text: 'Silakan masukkan jumlah nominal Berupa ANGKA Bilangan Positif Bukan Yang Lain.',
                confirmButtonText: 'OK'
            });
            return;
        }
        var dpp_ppn = Math.round(((100/111)*(11/12)* amount));
        var ppn = Math.round(((100/111)*(11/12)* amount) * 0.12);
        var dpp_pph = Math.round(amount-ppn);
        var pph22 = Math.round(((100/111) * amount) * 0.015);
        var pph23 = Math.round(((100/111) * amount) * 0.02);
        document.getElementById('dpp_ppn').textContent = formatCurrency(dpp_ppn);
        document.getElementById('dpp_pph').textContent = formatCurrency(dpp_pph);
        document.getElementById('ppn').textContent = formatCurrency(ppn);
        document.getElementById('pph22').textContent = formatCurrency(pph22);
        document.getElementById('pph23').textContent = formatCurrency(pph23);
    }

    // Function to reset the form
    function resetForm() {
        document.getElementById('amount').value = '';
        document.getElementById('dpp_ppn').textContent = '0';
        document.getElementById('dpp_pph').textContent = '0';
        document.getElementById('ppn').textContent = '0';
        document.getElementById('pph22').textContent = '0';
        document.getElementById('pph23').textContent = '0';
    }

    // Display the build version in the footer
    document.getElementById('build-version').textContent = buildVersion;

        Swal.fire({
        icon: 'info',
        title: 'Loading....',
        text: 'Mohon tunggu sebentar',
        timer: 1500,
        showConfirmButton: false
