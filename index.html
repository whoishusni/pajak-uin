<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Copyright 2024 Mohammad Husni Mubaraq -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pajak UIN Datokarama Palu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --navy:      #0a0f1e;
            --navy-mid:  #111827;
            --navy-card: #161e30;
            --navy-border: #1e2d45;
            --gold:      #c9a84c;
            --gold-light:#e8c97a;
            --gold-pale: #f5e6b8;
            --teal:      #1a9e8f;
            --teal-light:#22c5b4;
            --text-primary: #f0f4ff;
            --text-muted:   #8896b3;
            --text-dim:     #4a5878;
            --danger:    #e05c6e;
            --success:   #2dd4bf;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--navy);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ── Animated background ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(26,158,143,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 80%, rgba(201,168,76,0.10) 0%, transparent 55%),
                radial-gradient(ellipse 40% 40% at 50% 50%, rgba(10,15,30,0) 0%, var(--navy) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
            animation: drift 12s ease-in-out infinite;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--teal); top: -100px; left: -100px; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: var(--gold); bottom: -80px; right: -60px; animation-delay: -6s; }
        .orb-3 { width: 200px; height: 200px; background: #5b6fe6; top: 40%; right: 10%; animation-delay: -3s; }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%       { transform: translate(30px, -20px) scale(1.05); }
            66%       { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* Grid lines background */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Main layout ── */
        main {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px 60px;
        }

        .card {
            width: 100%;
            max-width: 680px;
            background: rgba(22, 30, 48, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 24px;
            padding: 48px 44px 44px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,168,76,0.08);
            animation: slideUp 0.7s cubic-bezier(0.22,1,0.36,1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .logo-placeholder {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #0e2233, #1a3347);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(26,158,143,0.3), 0 0 0 1px rgba(201,168,76,0.2);
            animation: pulse-glow 3s ease-in-out infinite;
            padding: 12px;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 8px 32px rgba(26,158,143,0.3); }
            50%       { box-shadow: 0 8px 48px rgba(26,158,143,0.55), 0 0 0 8px rgba(26,158,143,0.08); }
        }

        .badge {
            display: inline-block;
            background: linear-gradient(90deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05));
            border: 1px solid rgba(201,168,76,0.3);
            color: var(--gold-light);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 5px 14px;
            border-radius: 100px;
            margin-bottom: 14px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.25;
            margin-bottom: 8px;
        }

        h1 span { color: var(--gold-light); }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--navy-border), var(--gold), var(--navy-border), transparent);
            margin: 32px 0;
            opacity: 0.6;
        }

        /* ── Form ── */
        .form-group { margin-bottom: 8px; }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .input-wrap {
            position: relative;
        }

        .input-prefix {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 16px 15px 52px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'DM Mono', monospace;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: all 0.25s ease;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--text-dim);
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
        }

        input[type="text"]:focus {
            border-color: var(--teal);
            background: rgba(26,158,143,0.06);
            box-shadow: 0 0 0 3px rgba(26,158,143,0.12);
        }

        input[type="text"]:focus ~ .input-prefix,
        .input-wrap:focus-within .input-prefix {
            color: var(--teal-light);
        }

        /* ── Buttons ── */
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .btn:hover::after { opacity: 0.06; }
        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: linear-gradient(135deg, var(--teal) 0%, #148578 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(26,158,143,0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(26,158,143,0.5);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* ── Results ── */
        .results-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .results-header-line {
            flex: 1;
            height: 1px;
            background: var(--navy-border);
        }

        .results-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .results-grid {
            display: grid;
            gap: 10px;
        }

        .result-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .result-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            border-radius: 3px;
            background: var(--teal);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .result-card.active::before { opacity: 1; }
        .result-card.active {
            background: rgba(26,158,143,0.06);
            border-color: rgba(26,158,143,0.2);
        }

        .result-card.gold-accent::before { background: var(--gold); }
        .result-card.gold-accent.active {
            background: rgba(201,168,76,0.06);
            border-color: rgba(201,168,76,0.2);
        }

        .result-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .result-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .icon-teal { background: rgba(26,158,143,0.15); }
        .icon-gold { background: rgba(201,168,76,0.15); }
        .icon-blue { background: rgba(91,111,230,0.15); }

        .result-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .result-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .tag-teal { background: rgba(26,158,143,0.2); color: var(--teal-light); }
        .tag-gold { background: rgba(201,168,76,0.2); color: var(--gold-light); }
        .tag-blue { background: rgba(91,111,230,0.2); color: #8fa0ff; }

        .result-value {
            font-family: 'DM Mono', monospace;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            text-align: right;
            transition: all 0.4s ease;
        }

        .result-value.zero { color: var(--text-dim); font-size: 13px; }
        .result-value.has-value { color: var(--gold-light); }

        /* Shimmer animation when value updates */
        @keyframes shimmer-update {
            0%   { opacity: 0.3; transform: scale(0.95); }
            50%  { opacity: 1;   transform: scale(1.02); }
            100% { opacity: 1;   transform: scale(1); }
        }

        .value-updated { animation: shimmer-update 0.4s ease forwards; }

        /* ── Footer ── */
        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--text-dim);
            border-top: 1px solid rgba(255,255,255,0.04);
        }

        footer span { color: var(--gold); }

        /* ── SweetAlert custom ── */
        .swal2-popup {
            background: var(--navy-card) !important;
            border: 1px solid var(--navy-border) !important;
            color: var(--text-primary) !important;
            border-radius: 16px !important;
            font-family: 'DM Sans', sans-serif !important;
        }
        .swal2-title { color: var(--text-primary) !important; font-family: 'Playfair Display', serif !important; }
        .swal2-html-container { color: var(--text-muted) !important; }
        .swal2-confirm { background: linear-gradient(135deg, var(--teal), #148578) !important; border-radius: 10px !important; font-family: 'DM Sans', sans-serif !important; font-weight: 600 !important; }
        .swal2-icon { border-color: var(--teal) !important; }
        .swal2-icon.swal2-info { color: var(--teal) !important; }
        .swal2-icon.swal2-error { color: var(--danger) !important; border-color: var(--danger) !important; }

        /* Responsive */
        @media (max-width: 600px) {
            .card { padding: 32px 24px; }
            h1 { font-size: 22px; }
            .btn-row { flex-direction: column; }
        }
    </style>
</head>
<body>
<!-- Copyright 2024 Mohammad Husni Mubaraq -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="grid-bg"></div>

<main>
    <div class="card">

        <!-- Header -->
        <div class="header">
            <div class="logo-wrap">
                <div class="logo-placeholder">
                    <svg viewBox="0 0 80 80" width="66" height="66" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                                <feGaussianBlur stdDeviation="2.5" result="blur"/>
                                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                            </filter>
                            <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#e8c97a"/>
                                <stop offset="100%" stop-color="#c9a84c"/>
                            </linearGradient>
                            <linearGradient id="tealGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#22c5b4"/>
                                <stop offset="100%" stop-color="#1a9e8f"/>
                            </linearGradient>
                            <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#2a4060"/>
                                <stop offset="100%" stop-color="#1a2d45"/>
                            </linearGradient>
                        </defs>
                        <!-- Base pedestal -->
                        <rect x="30" y="68" width="20" height="4" rx="2" fill="url(#goldGrad)" filter="url(#glow)"/>
                        <!-- Pole stand -->
                        <rect x="37" y="54" width="6" height="15" rx="3" fill="url(#goldGrad)"/>
                        <!-- Center pole -->
                        <rect x="39" y="14" width="2.5" height="42" rx="1.25" fill="url(#goldGrad)" filter="url(#glow)"/>
                        <!-- Top pivot ball -->
                        <circle cx="40" cy="13" r="4" fill="url(#goldGrad)" filter="url(#glow)"/>
                        <circle cx="39" cy="12" r="1.2" fill="rgba(255,255,255,0.35)"/>
                        <!-- Crossbeam tilted -->
                        <rect x="10" y="22" width="60" height="3" rx="1.5" fill="url(#goldGrad)" filter="url(#glow)" transform="rotate(-4 40 23.5)"/>
                        <!-- Left chain -->
                        <line x1="18" y1="25" x2="16" y2="40" stroke="url(#goldGrad)" stroke-width="1.4" stroke-dasharray="2.5 2" stroke-linecap="round"/>
                        <!-- Right chain -->
                        <line x1="62" y1="23" x2="64" y2="36" stroke="url(#goldGrad)" stroke-width="1.4" stroke-dasharray="2.5 2" stroke-linecap="round"/>
                        <!-- Left plate -->
                        <ellipse cx="16" cy="43" rx="12" ry="4" fill="url(#plateGrad)" stroke="url(#goldGrad)" stroke-width="1.2"/>
                        <ellipse cx="16" cy="42.2" rx="10" ry="2.4" fill="url(#tealGrad)" opacity="0.35"/>
                        <!-- Left coin stack -->
                        <rect x="10" y="37" width="12" height="5.5" rx="2.5" fill="url(#tealGrad)" opacity="0.9"/>
                        <rect x="11" y="35.5" width="10" height="2.5" rx="1.25" fill="url(#tealGrad)"/>
                        <text x="16" y="41.5" text-anchor="middle" font-size="4.5" fill="white" font-family="DM Sans, sans-serif" font-weight="bold" opacity="0.9">IDR</text>
                        <!-- Right plate -->
                        <ellipse cx="64" cy="39" rx="12" ry="4" fill="url(#plateGrad)" stroke="url(#goldGrad)" stroke-width="1.2"/>
                        <ellipse cx="64" cy="38.2" rx="10" ry="2.4" fill="url(#goldGrad)" opacity="0.25"/>
                        <!-- Right plate document -->
                        <rect x="58" y="30" width="12" height="8" rx="1.5" fill="rgba(255,255,255,0.12)" stroke="url(#goldGrad)" stroke-width="0.8"/>
                        <line x1="60" y1="33" x2="68" y2="33" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.8"/>
                        <line x1="60" y1="35" x2="68" y2="35" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.6"/>
                        <line x1="60" y1="37" x2="65" y2="37" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.5"/>
                        <!-- Sparkles -->
                        <circle cx="12" cy="10" r="1.2" fill="#e8c97a" opacity="0.7"/>
                        <circle cx="68" cy="8" r="0.9" fill="#22c5b4" opacity="0.7"/>
                        <circle cx="72" cy="50" r="0.7" fill="#e8c97a" opacity="0.5"/>
                        <circle cx="8" cy="55" r="0.7" fill="#22c5b4" opacity="0.5"/>
                    </svg>
                </div>
            </div>
            <div class="badge">UIN Datokarama Palu</div>
            <h1>Kalkulator <span>Perpajakan</span></h1>
            <p class="subtitle">Perhitungan otomatis DPP, PPN & PPh berdasarkan regulasi berlaku</p>
        </div>

        <div class="divider"></div>

        <!-- Form -->
        <div class="form-group">
            <label for="amount">Nominal Transaksi</label>
            <div class="input-wrap">
                <span class="input-prefix">Rp</span>
                <input type="text" id="amount" placeholder="0" oninput="formatInput(this)">
            </div>
        </div>

        <div class="btn-row">
            <button class="btn btn-primary" onclick="calculateTaxes()">
                ⚡ Hitung Pajak
            </button>
            <button class="btn btn-secondary" onclick="resetForm()">
                ↺ Reset
            </button>
        </div>

        <div class="divider"></div>

        <!-- Results -->
        <div class="results-header">
            <div class="results-header-line"></div>
            <span class="results-label">Hasil Perhitungan</span>
            <div class="results-header-line"></div>
        </div>

        <div class="results-grid">

            <div class="result-card" id="card-dpp-ppn">
                <div class="result-left">
                    <div class="result-icon icon-teal">🧮</div>
                    <div>
                        <div class="result-name">DPP PPN <span class="result-tag tag-teal">Dasar Pengenaan</span></div>
                    </div>
                </div>
                <div class="result-value zero" id="dpp_ppn">—</div>
            </div>

            <div class="result-card" id="card-dpp-pph">
                <div class="result-left">
                    <div class="result-icon icon-teal">🧮</div>
                    <div>
                        <div class="result-name">DPP PPh <span class="result-tag tag-teal">Dasar Pengenaan</span></div>
                    </div>
                </div>
                <div class="result-value zero" id="dpp_pph">—</div>
            </div>

            <div class="result-card gold-accent" id="card-ppn">
                <div class="result-left">
                    <div class="result-icon icon-gold">📊</div>
                    <div>
                        <div class="result-name">PPN <span class="result-tag tag-gold">12%</span></div>
                    </div>
                </div>
                <div class="result-value zero" id="ppn">—</div>
            </div>

            <div class="result-card" id="card-pph22">
                <div class="result-left">
                    <div class="result-icon icon-blue">💼</div>
                    <div>
                        <div class="result-name">PPh Pasal 22 <span class="result-tag tag-blue">1,5%</span></div>
                    </div>
                </div>
                <div class="result-value zero" id="pph22">—</div>
            </div>

            <div class="result-card" id="card-pph23">
                <div class="result-left">
                    <div class="result-icon icon-blue">📋</div>
                    <div>
                        <div class="result-name">PPh Pasal 23 <span class="result-tag tag-blue">2%</span></div>
                    </div>
                </div>
                <div class="result-value zero" id="pph23">—</div>
            </div>

        </div>
    </div>
</main>

<footer>
    &copy; 2024–2026 <span>Husni</span> &mdash; All Rights Reserved &nbsp;|&nbsp;
    Build: <span id="build-version"></span>
</footer>

<script>
    const buildVersion = "05 Januari 2026";

    function formatCurrency(amount) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount);
    }

    function formatInput(el) {
        const raw = el.value.replace(/\D/g, '');
        if (!raw) { el.value = ''; return; }
        el.value = new Intl.NumberFormat('id-ID').format(parseInt(raw));
    }

    function setResult(id, cardId, value, isGold) {
        const el = document.getElementById(id);
        const card = document.getElementById(cardId);
        el.classList.remove('zero', 'has-value', 'value-updated');
        void el.offsetWidth; // reflow for animation
        if (value === 0 || isNaN(value)) {
            el.textContent = '—';
            el.classList.add('zero');
            card.classList.remove('active');
        } else {
            el.textContent = formatCurrency(value);
            el.classList.add('has-value', 'value-updated');
            card.classList.add('active');
        }
    }

    function calculateTaxes() {
        const raw = document.getElementById('amount').value.replace(/\D/g, '');
        const amount = parseFloat(raw);

        if (!raw || isNaN(amount) || amount <= 0) {
            Swal.fire({
                icon: 'error',
                title: 'Nominal Tidak Valid',
                text: 'Masukkan jumlah nominal berupa angka positif.',
                confirmButtonText: 'OK'
            });
            return;
        }

        const dpp_ppn = Math.round((100 / 111) * (11 / 12) * amount);
        const ppn     = Math.round(dpp_ppn * 0.12);
        const dpp_pph = Math.round(amount - ppn);
        const pph22   = Math.round((100 / 111) * amount * 0.015);
        const pph23   = Math.round((100 / 111) * amount * 0.02);

        // Staggered reveal
        const updates = [
            ['dpp_ppn', 'card-dpp-ppn', dpp_ppn],
            ['dpp_pph', 'card-dpp-pph', dpp_pph],
            ['ppn',     'card-ppn',     ppn, true],
            ['pph22',   'card-pph22',   pph22],
            ['pph23',   'card-pph23',   pph23],
        ];

        updates.forEach(([id, card, val, gold], i) => {
            setTimeout(() => setResult(id, card, val, gold), i * 90);
        });
    }

    function resetForm() {
        document.getElementById('amount').value = '';
        ['dpp_ppn','dpp_pph','ppn','pph22','pph23'].forEach(id => {
            const el = document.getElementById(id);
            el.textContent = '—';
            el.className = 'result-value zero';
        });
        ['card-dpp-ppn','card-dpp-pph','card-ppn','card-pph22','card-pph23'].forEach(id => {
            document.getElementById(id).classList.remove('active');
        });
    }

    // Enter key shortcut
    document.getElementById('amount').addEventListener('keydown', e => {
        if (e.key === 'Enter') calculateTaxes();
    });

    document.getElementById('build-version').textContent = buildVersion;

    window.onload = function () {
        Swal.fire({
            icon: 'info',
            title: 'Selamat Datang',
            text: 'Mohon tunggu sebentar…',
            timer: 1400,
            showConfirmButton: false,
            backdrop: 'rgba(10,15,30,0.7)'
        });
    };
</script>
</body>
</html>
